<!doctype html>
<html><head><meta charset="utf-8"><title>엔트리루트 애니메이터 1.2</title>
<style>
html, body { margin: 0; background: #f4efe6; overflow: hidden; }
svg { display: block; }
text { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
</style></head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
<!--DEFS-->
  <pattern id="ruled" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 39.5 H40" stroke="#c9d6ee" stroke-width="1"/></pattern>
  <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 5.5 H6 M5.5 0 V6" stroke="#ece5d6" stroke-width="1"/></pattern>
  <pattern id="stripes" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)"><rect width="30" height="13" fill="#ffa424"/></pattern>
  <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a4a30" flood-opacity=".22"/></filter>
  <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5a4a30" flood-opacity=".16"/></filter>
  <filter id="erode" x="-5%" y="-5%" width="110%" height="110%"><feMorphology operator="erode" radius="2.4"/></filter>
  <mask id="suitMask" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000">
    <rect id="maskAll" x="-212" y="-178" width="424" height="370" fill="#fff"/>
    <use id="maskSuit" href="#bot1Suit" filter="url(#erode)"/>
  </mask>
  <clipPath id="tileClip"><rect x="-190" y="-140" width="380" height="280"/></clipPath>
</defs>
<rect width="1280" height="720" fill="#f4efe6"/>
<g id="root"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo = k => 1 - Math.pow(1 - k, 3);
const ei = k => k * k * k;
const back = k => { const c1 = 1.70158, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const rad = d => d * Math.PI / 180;
const INK = '#1f2233', BONE = '#ff5a36', SUB = '#7a7466', FAINT = '#9aa0b5', PAPER = '#fffdf8', TAB = '#ebe4d6', BLUE = '#3b6cff', ORANGE = '#ffa424';
const root = document.getElementById('root');
const txt = (parent, x, y, size, fill, anchor, s, weight = 700, extra = {}) => { const e = $('text', { x, y, 'font-size': size, 'font-weight': weight, fill, 'text-anchor': anchor, 'letter-spacing': size > 60 ? -2 : -0.8, ...extra }, parent); e.textContent = s; return e; };
const swap = (t, a) => { const o = seg(t, a, a + .16), i = seg(t, a + .16, a + .32); return { o: 1 - o, i, oy: -12 * o, iy: 12 * (1 - i) }; };
const swapSet = (sw, h1, h2, c1, c2) => { set(h1, { opacity: sw.o, transform: `translate(0 ${sw.oy})` }); set(h2, { opacity: sw.i, transform: `translate(0 ${sw.iy})` }); set(c1, { opacity: sw.o }); set(c2, { opacity: sw.i }); };
const show = (g, on) => g.setAttribute('display', on ? 'inline' : 'none');

// 핀 구멍 종이(1.0 영상과 같은 종이)
function card(parent, w, h, { ruled = true } = {}) {
  const g = $('g', {}, parent);
  const paper = $('rect', { rx: 6, fill: PAPER, filter: 'url(#paperShadow)' }, g);
  const lines = ruled ? $('rect', { fill: 'url(#ruled)', opacity: .6 }, g) : null;
  const tabs = $('g', {}, g);
  const t1 = $('rect', { width: 26, height: 7, rx: 3.5, fill: TAB }, tabs), t2 = $('circle', { r: 5, fill: TAB }, tabs), t3 = $('rect', { width: 26, height: 7, rx: 3.5, fill: TAB }, tabs);
  const api = { g, size(w2, h2) { set(paper, { x: -w2 / 2, y: -h2 / 2, width: w2, height: h2 }); if (lines) set(lines, { x: -w2 / 2, y: -h2 / 2, width: w2, height: h2 }); set(t1, { x: -46, y: -h2 / 2 + 12 }); set(t2, { cx: 0, cy: -h2 / 2 + 15.5 }); set(t3, { x: 20, y: -h2 / 2 + 12 }); } };
  api.size(w, h);
  return api;
}
// 관절(속 빈 고리 = 뿌리)
const joint = (parent, rootRing = false) => $('circle', { r: rootRing ? 10 : 8, fill: rootRing ? PAPER : '#fff', stroke: BONE, 'stroke-width': rootRing ? 5 : 4.5 }, parent);
const cursor = $('path', { d: 'M0,0 L0,27 L7,21 L12,32 L17.5,29.6 L12.6,19 L21,19 Z', fill: '#fff', stroke: INK, 'stroke-width': 2.2, 'stroke-linejoin': 'round' });

// ---------- 0. 제목 ----------
const S0 = $('g', {}, root);
const s0text = $('g', {}, S0);
const s0name = txt(s0text, 640, 252, 30, SUB, 'middle', '엔트리루트 애니메이터', 700);
const s0big = $('g', {}, s0text);
const s0n = txt(s0big, 600, 392, 168, INK, 'end', '1.2', 700);
const s0u = txt(s0big, 626, 392, 76, INK, 'start', '업데이트', 700);
const s0bone = $('polyline', { fill: 'none', stroke: BONE, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, S0);
const s0j = [joint(S0, true), joint(S0), joint(S0), joint(S0)];
const s0cur = cursor.cloneNode(); S0.appendChild(s0cur);

function scene0(t) {
  show(S0, t < 1.8); if (t >= 1.8) return;
  const draw = eo(seg(t, 0.05, 0.6)), bend = eio(seg(t, 1.12, 1.6));
  const idle = Math.sin((t - 0.6) * 7) * 3 * seg(t, 0.6, 0.8) * (1 - seg(t, 1.0, 1.12));
  const a1 = rad(idle - 24 * bend), a2 = rad(idle * .6 - 34 * bend);
  const p0 = [358, 432], L = 188;
  const p1 = [p0[0] + L, p0[1]], p2 = [p1[0] + L * Math.cos(a1), p1[1] + L * Math.sin(a1)], p3 = [p2[0] + L * Math.cos(a1 + a2), p2[1] + L * Math.sin(a1 + a2)];
  const pts = [p0, p1, p2, p3];
  set(s0bone, { points: pts.map(p => p.join(',')).join(' '), 'stroke-dasharray': 600, 'stroke-dashoffset': 600 * (1 - draw) });
  pts.forEach((p, i) => { const k = back(seg(t, 0.08 + i * 0.15, 0.3 + i * 0.15)); set(s0j[i], { cx: p[0], cy: p[1], transform: `translate(${p[0]} ${p[1]}) scale(${k}) translate(${-p[0]} ${-p[1]})` }); });
  const up = back(seg(t, 0.22, 0.7)), up2 = back(seg(t, 0.32, 0.8));
  set(s0n, { opacity: seg(t, 0.22, 0.4), transform: `translate(0 ${40 * (1 - up)})` });
  set(s0u, { opacity: seg(t, 0.32, 0.5), transform: `translate(0 ${40 * (1 - up2)})` });
  set(s0name, { opacity: seg(t, 0.1, 0.45) });
  set(s0text, { opacity: 1 - seg(t, 1.25, 1.6), transform: `translate(0 ${-50 * ei(seg(t, 1.2, 1.65))})` });
  // 커서가 끝 관절을 잡고 아래로 끈다
  const ca = eo(seg(t, 0.75, 1.05));
  const cx = lerp(1060, p3[0], ca), cy = lerp(560, p3[1], ca);
  set(s0cur, { transform: `translate(${cx + 4} ${cy + 2}) scale(${t > 1.08 && t < 1.62 ? .92 : 1})`, opacity: seg(t, 0.75, 0.85) * (1 - seg(t, 1.6, 1.75)) });
  set(S0, { opacity: 1 - seg(t, 1.6, 1.78), transform: `translate(${-60 * ei(seg(t, 1.45, 1.78))} 0)` });
}

// ---------- 1. 레이어 · 클리핑 ----------
const S1 = $('g', {}, root);
const c1 = card(S1, 460, 420);
const cels = [0, 1, 2, 3].map(() => $('g', {}, c1.g)); // 배경 · 옷 · 무늬(옷에 클리핑) · 선·얼굴
const sheetFrame = cels.map(g => $('rect', { x: -212, y: -178, width: 424, height: 370, rx: 12, fill: '#ffffff', 'fill-opacity': .35, stroke: '#c9d6ee', 'stroke-width': 2, filter: 'url(#sheetShadow)' }, g));
// 배경: 옅은 하늘 + 해 + 땅
$('rect', { x: -212, y: -178, width: 424, height: 370, rx: 12, fill: '#e3ecff' }, cels[0]);
$('circle', { cx: -118, cy: -92, r: 40, fill: '#ffd98a' }, cels[0]);
$('path', { d: 'M-212 132 C-120 112 -40 150 60 128 C140 112 180 126 212 120 L212 180 Q212 192 200 192 L-200 192 Q-212 192 -212 180 Z', fill: '#d5e8cc' }, cels[0]);
// 엔트리봇
const BOT_T = 'translate(-86 -168) scale(1.2)';
const s1bot = $('use', { href: '#bot1Blue', transform: BOT_T }, cels[1]);
const s1rest = $('use', { href: '#bot1Rest', transform: BOT_T }, cels[3]);
// 무늬(줄무늬) — 클리핑 가면
const pat = $('g', { mask: 'url(#suitMask)' }, cels[2]);
$('rect', { x: -212, y: -178, width: 424, height: 370, rx: 12, fill: 'url(#stripes)', opacity: .92 }, pat);
set(document.getElementById('maskSuit'), { transform: BOT_T });
// 레이어 창 줄
const panel = $('g', {}, S1);
const s1head = $('g', {}, S1), s1h1 = txt(s1head, 0, 0, 44, INK, 'start', '레이어로 나눠 그리고'), s1h2 = txt(s1head, 0, 0, 44, INK, 'start', '옷 안에만 칠해요');
const s1cap = $('g', {}, S1), s1c1 = txt(s1cap, 0, 0, 21, SUB, 'start', '레이어 창 · 불투명도 · 투명 잠금', 600), s1c2 = txt(s1cap, 0, 0, 21, SUB, 'start', '클리핑 · 클리핑 마스크', 600);
const rows = ['선·얼굴', '무늬', '옷', '배경'].map((name, i) => {
  const g = $('g', {}, panel);
  const box = $('rect', { x: 0, y: 0, width: 316, height: 60, rx: 13, fill: '#fff', stroke: '#e3dbc9', 'stroke-width': 2 }, g);
  const th = $('rect', { x: 12, y: 10, width: 40, height: 40, rx: 7, fill: ['#ffffff', 'url(#stripes)', '#009ff8', '#e3ecff'][i], stroke: '#e3dbc9' }, g);
  txt(g, 66, 39, 25, INK, 'start', name, 700);
  const eye = $('circle', { cx: 290, cy: 30, r: 6, fill: '#c9cfdd' }, g);
  return { g, box, eye };
});
const chip = $('g', {}, rows[1].g);
$('rect', { x: 170, y: 15, width: 92, height: 30, rx: 15, fill: BLUE }, chip);
txt(chip, 216, 37, 17, '#fff', 'middle', '클리핑', 700);
const s1cur = cursor.cloneNode(); S1.appendChild(s1cur);

function scene1(t) {
  show(S1, t > 1.5 && t < 5.85); if (!(t > 1.5 && t < 5.85)) return;
  const enter = eo(seg(t, 1.55, 2.05)), exit = ei(seg(t, 5.3, 5.8));
  const cx = lerp(1560, 400, enter) - 1150 * exit, cy = 384 + Math.sin(t * 2.2) * 3;
  set(c1.g, { transform: `translate(${cx} ${cy})` });
  const sep = eio(seg(t, 2.05, 2.7)) * (1 - eio(seg(t, 3.3, 3.85)));
  const sway = Math.sin(t * 3.1) * 6 * sep;
  cels.forEach((g, i) => {
    const d = i - 1.5;
    set(g, { transform: `translate(${(d * 70 + sway * d) * sep} ${(d * 46) * sep}) skewY(${-9 * sep}) scale(${1 - 0.12 * sep})` });
    set(sheetFrame[i], { opacity: sep });
  });
  // 줄 순서(앞이 무늬): 떨어진 동안 무늬 시트가 오른쪽 아래(앞), 배경이 왼쪽 위(뒤)
  const clipOn = eio(seg(t, 4.15, 4.75));
  set(document.getElementById('maskAll'), { opacity: 1 - clipOn });
  // 걷기(옷 무늬도 같이)
  const walk = t > 4.75 ? (Math.floor((t - 4.75) / 0.2) % 2 ? '#bot2' : '#bot1') : '#bot1';
  set(s1bot, { href: walk + 'Blue' }); set(s1rest, { href: walk + 'Rest' }); set(document.getElementById('maskSuit'), { href: walk + 'Suit' });
  // 오른쪽 글과 레이어 줄
  const tx = 724 + 260 * exit;
  const sw = swap(t, 3.85);
  set(s1head, { transform: `translate(${tx + 40 * (1 - eo(seg(t, 2.0, 2.4)))} 196)`, opacity: seg(t, 2.0, 2.3) * (1 - exit) });
  swapSet(sw, s1h1, s1h2, s1c1, s1c2);
  set(s1cap, { transform: `translate(${tx} 572)`, opacity: seg(t, 2.6, 2.9) * (1 - exit) });
  rows.forEach((r, i) => {
    const k = eo(seg(t, 2.25 + i * 0.1, 2.65 + i * 0.1));
    set(r.g, { transform: `translate(${tx + 80 * (1 - k)} ${238 + i * 72})`, opacity: k * (1 - exit) });
    set(r.box, { stroke: i === 1 && t > 3.55 ? BLUE : '#e3dbc9', 'stroke-width': i === 1 && t > 3.55 ? 3 : 2 });
  });
  const ck = back(seg(t, 3.95, 4.2));
  set(chip, { opacity: seg(t, 3.95, 4.05), transform: `translate(216 30) scale(${ck}) translate(-216 -30)` });
  // 커서: 무늬 줄 → [클리핑]
  const ca = eio(seg(t, 3.45, 3.9));
  const px = lerp(1180, tx + 222, ca), py = lerp(640, 238 + 72 + 36, ca);
  set(s1cur, { transform: `translate(${px} ${py}) scale(${t > 3.93 && t < 4.08 ? .88 : 1})`, opacity: seg(t, 3.45, 3.55) * (1 - seg(t, 4.5, 4.7)) });
}

// ---------- 2. 사각 펜 · 비트맵 뼈대 ----------
const S2 = $('g', {}, root);
const c2 = card(S2, 420, 430, { ruled: false });
$('rect', { x: -186, y: -178, width: 372, height: 372, fill: 'url(#grid)' }, c2.g);
const pxImg = $('image', { style: 'image-rendering: pixelated; image-rendering: crisp-edges' }, c2.g);
const s2bone = $('polyline', { fill: 'none', stroke: BONE, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, c2.g);
const s2j = [joint(c2.g, true), joint(c2.g), joint(c2.g)];
const pen = $('rect', { width: 14, height: 14, fill: 'none', stroke: BONE, 'stroke-width': 3 }, c2.g);
const s2cur = cursor.cloneNode(); c2.g.appendChild(s2cur);
const s2head = $('g', {}, S2), s2h1 = txt(s2head, 0, 0, 44, INK, 'start', '칸에 딱 맞춰 찍고'), s2h2 = txt(s2head, 0, 0, 44, INK, 'start', '도트 그림도 휘어요');
const s2cap = $('g', {}, S2), s2c1 = txt(s2cap, 0, 0, 21, SUB, 'start', '사각 펜 · 사각 지우개', 600), s2c2 = txt(s2cap, 0, 0, 21, SUB, 'start', '비트맵 뼈대', 600);
const PX = 6, PW = 32, PH = 55, OW = 56, OH = 60; // 그림 칸 크기와 휘는 여유
const pxCanvas = document.createElement('canvas'); pxCanvas.width = OW; pxCanvas.height = OH;
let pixels = null, order = [];
const PAL = [[35, 24, 21], [255, 255, 255], [0, 159, 248], [0, 136, 197], [255, 190, 184], [104, 49, 0]];
window.__ready = (async () => {
  // 1.0 영상의 엔트리봇을 작은 칸 그림으로(도트) — 가까운 색으로 맞춤
  const sym = document.getElementById('bot1');
  const svg = `<svg xmlns="${NS}" viewBox="0 0 144 246" width="${PW}" height="${PH}">${sym.innerHTML}</svg>`;
  const img = new Image(); img.src = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  await img.decode();
  const c = document.createElement('canvas'); c.width = PW; c.height = PH; const g = c.getContext('2d'); g.drawImage(img, 0, 0, PW, PH);
  const d = g.getImageData(0, 0, PW, PH).data; pixels = new Int8Array(PW * PH).fill(-1);
  for (let i = 0; i < PW * PH; i++) {
    const a = d[i * 4 + 3]; if (a < 100) continue;
    const r = d[i * 4] * 255 / a, gg = d[i * 4 + 1] * 255 / a, b = d[i * 4 + 2] * 255 / a;
    const lum = .3 * r + .59 * gg + .11 * b;
    if (lum < 95 || a < 200) { pixels[i] = 0; continue; }
    let best = 1, bd = 1e9; for (let k = 1; k < PAL.length; k++) { const p = PAL[k], dd = (p[0] - r) ** 2 + (p[1] - gg) ** 2 + (p[2] - b) ** 2; if (dd < bd) { bd = dd; best = k; } }
    pixels[i] = best;
  }
  // 찍는 순서: 바깥선은 가운데를 도는 순서, 칠은 가운데에서 퍼지는 순서
  const cxm = PW / 2, cym = PH / 2, line = [], fill = [];
  for (let i = 0; i < PW * PH; i++) if (pixels[i] >= 0) (pixels[i] === 0 ? line : fill).push(i);
  const ang = i => Math.atan2((i / PW | 0) - cym, i % PW - cxm);
  line.sort((a, b) => ang(a) - ang(b));
  fill.sort((a, b) => Math.hypot(a % PW - cxm, (a / PW | 0) - cym) - Math.hypot(b % PW - cxm, (b / PW | 0) - cym));
  order = line.concat(fill);
})();
const smooth = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
function drawPixels(revealed, angle) {
  const g = pxCanvas.getContext('2d'), out = g.createImageData(OW, OH), o = out.data;
  const shown = new Uint8Array(PW * PH); for (let k = 0; k < revealed; k++) shown[order[k]] = 1;
  const ox = (OW - PW) / 2, oy = OH - PH, hipY = oy + PH * 0.64, pvx = ox + PW / 2;
  for (let y = 0; y < OH; y++) for (let x = 0; x < OW; x++) {
    const w = smooth(hipY + 3, hipY - 9, y + .5), a = -angle * w;
    const dx = x + .5 - pvx, dy = y + .5 - hipY;
    const sx = Math.floor(Math.cos(a) * dx - Math.sin(a) * dy + pvx - ox), sy = Math.floor(Math.sin(a) * dx + Math.cos(a) * dy + hipY - oy);
    if (sx < 0 || sy < 0 || sx >= PW || sy >= PH) continue;
    const i = sy * PW + sx; if (!shown[i] || pixels[i] < 0) continue;
    const p = PAL[pixels[i]], j = (y * OW + x) * 4; o[j] = p[0]; o[j + 1] = p[1]; o[j + 2] = p[2]; o[j + 3] = 255;
  }
  g.putImageData(out, 0, 0);
  pxImg.setAttribute('href', pxCanvas.toDataURL());
  return { ox, oy, hipY, pvx };
}
function scene2(t) {
  show(S2, t > 5.4 && t < 9.6); if (!(t > 5.4 && t < 9.6) || !pixels) return;
  const enter = eo(seg(t, 5.45, 5.95)), exit = ei(seg(t, 9.05, 9.55));
  const cx = lerp(1600, 866, enter), cy = 380 + 760 * exit + Math.sin(t * 2.2) * 3;
  set(c2.g, { transform: `translate(${cx} ${cy}) rotate(${6 * exit})` });
  const revealed = Math.floor(order.length * eio(seg(t, 5.9, 7.2)));
  const bend = t < 7.65 ? 0 : t < 8.05 ? 20 * eio(seg(t, 7.65, 8.05)) : t < 8.55 ? lerp(20, -15, eio(seg(t, 8.05, 8.55))) : lerp(-15, 9, eio(seg(t, 8.55, 8.95)));
  const angle = rad(bend);
  const g = drawPixels(revealed, angle);
  const X0 = -OW * PX / 2, Y0 = 190 - OH * PX; // 칸 그림 왼쪽 위(카드 좌표)
  set(pxImg, { x: X0, y: Y0, width: OW * PX, height: OH * PX });
  // 사각 펜 끝: 마지막에 찍은 칸
  if (revealed > 0 && revealed < order.length) { const i = order[revealed - 1]; set(pen, { x: X0 + (i % PW + g.ox) * PX - 4, y: Y0 + ((i / PW | 0) + g.oy) * PX - 4, opacity: 1 }); }
  else set(pen, { opacity: 0 });
  // 뼈대: 발 → 허리 → 머리
  const draw = eo(seg(t, 7.25, 7.6));
  const P = (x, y) => [X0 + x * PX, Y0 + y * PX];
  const r0 = P(g.pvx, g.oy + PH - 3), r1 = P(g.pvx, g.hipY), len = (g.hipY - g.oy - 6) * PX;
  const r2 = [r1[0] + Math.sin(angle) * len, r1[1] - Math.cos(angle) * len];
  set(s2bone, { points: [r0, r1, r2].map(p => p.join(',')).join(' '), 'stroke-dasharray': 500, 'stroke-dashoffset': 500 * (1 - draw), opacity: draw > 0 ? 1 : 0 });
  [r0, r1, r2].forEach((p, i) => { const k = back(seg(t, 7.25 + i * .1, 7.45 + i * .1)); set(s2j[i], { cx: p[0], cy: p[1], transform: `translate(${p[0]} ${p[1]}) scale(${k}) translate(${-p[0]} ${-p[1]})` }); });
  const ca = eo(seg(t, 7.45, 7.65));
  set(s2cur, { transform: `translate(${lerp(260, r2[0] + 4, ca)} ${lerp(-120, r2[1] + 2, ca)}) scale(${t > 7.65 && t < 8.95 ? .9 : 1})`, opacity: seg(t, 7.45, 7.55) * (1 - seg(t, 8.95, 9.1)) });
  // 왼쪽 글
  const sw = swap(t, 7.2), tx = 118 - 120 * exit;
  set(s2head, { transform: `translate(${tx - 40 * (1 - eo(seg(t, 5.8, 6.2)))} 330)`, opacity: seg(t, 5.8, 6.1) * (1 - exit) });
  swapSet(sw, s2h1, s2h2, s2c1, s2c2);
  set(s2cap, { transform: `translate(${tx} 378)`, opacity: seg(t, 6.1, 6.4) * (1 - exit) });
}

// ---------- 3. 캔버스 크기 · 무한 배경 ----------
const S3 = $('g', {}, root);
const s3head = $('g', {}, S3), s3h1 = txt(s3head, 640, 0, 44, INK, 'middle', '더 넓게'), s3h2 = txt(s3head, 640, 0, 44, INK, 'middle', '끝없이 이어서');
const s3cap = $('g', {}, S3), s3c1 = txt(s3cap, 640, 0, 21, SUB, 'middle', '캔버스 크기', 600), s3c2 = txt(s3cap, 640, 0, 21, SUB, 'middle', '무한 배경', 600);
const c3wrap = $('g', {}, S3);
const c3 = card(c3wrap, 440, 300);
const stage = $('g', {}, c3.g);
$('rect', { x: -160, y: -90, width: 320, height: 180, fill: 'none', stroke: FAINT, 'stroke-width': 2.5, 'stroke-dasharray': '9 7', rx: 3 }, stage);
txt(stage, -150, -70, 15, FAINT, 'start', '무대', 700);
const s3bot = $('use', { href: '#bot1' }, c3.g);
// 무한 배경: 가운데 칸 + 양옆 사본
const tileLayer = $('g', {}, c3.g);
const tile = $('g', { id: 'tileContent' }, tileLayer);
const tileInner = $('g', { 'clip-path': 'url(#tileClip)' }, tile);
const WAVE = 'M-70 20 C-40 -60 10 -60 40 10 S120 90 160 0 S240 -70 300 -10';
const stroke1 = $('path', { d: WAVE, fill: 'none', stroke: BONE, 'stroke-width': 16, 'stroke-linecap': 'round' }, tileInner);
const stroke2 = $('path', { d: WAVE, fill: 'none', stroke: BONE, 'stroke-width': 16, 'stroke-linecap': 'round', transform: 'translate(-380 0)' }, tileInner);
const copies = [-380, 380].map(x => $('use', { href: '#tileContent', x, opacity: .42 }, tileLayer));
const tileLines = [-190, 190].map(x => $('line', { x1: x, y1: -146, x2: x, y2: 146, stroke: BLUE, 'stroke-width': 2.5, 'stroke-dasharray': '3 7', 'stroke-linecap': 'round' }, tileLayer));
const fog = [-1, 1].map(s => $('rect', { x: s < 0 ? -580 : 190, y: -150, width: 390, height: 300, fill: '#f4efe6', opacity: .28 }, tileLayer));
let waveLen = 0;
function scene3(t) {
  show(S3, t > 9.25 && t < 12.95); if (!(t > 9.25 && t < 12.95)) return;
  if (!waveLen) waveLen = stroke1.getTotalLength();
  const drop = back(seg(t, 9.3, 9.85)), out = eio(seg(t, 12.45, 12.9));
  set(c3wrap, { transform: `translate(640 ${lerp(-260, 418, drop) + Math.sin(t * 2.2) * 3}) scale(${1 - 0.12 * out})`, opacity: 1 - out });
  const wide = eio(seg(t, 9.95, 10.7));
  c3.size(lerp(440, 1180, wide), lerp(300, 330, wide));
  // 엔트리봇이 무대 밖으로 걸어 나감
  const walkK = eio(seg(t, 10.15, 11.0));
  const step = t > 10.15 && t < 11.0 ? (Math.floor((t - 10.15) / 0.13) % 2 ? '#bot2' : '#bot1') : '#bot1';
  const bx = lerp(0, 360, walkK), botFade = 1 - seg(t, 11.05, 11.3);
  set(s3bot, { href: step, transform: `translate(${bx - 40} ${90 - 138}) scale(.56)`, opacity: botFade });
  set(stage, { opacity: 1 - seg(t, 11.05, 11.3) });
  // 무한 배경 켜짐
  const tileK = seg(t, 11.1, 11.4);
  set(tileLayer, { opacity: tileK });
  const drawK = eio(seg(t, 11.35, 12.35));
  [stroke1, stroke2].forEach(p => set(p, { 'stroke-dasharray': waveLen, 'stroke-dashoffset': waveLen * (1 - drawK) }));
  const sw = swap(t, 11.0);
  const ty = 112 + (1 - eo(seg(t, 9.55, 9.95))) * -30;
  set(s3head, { transform: `translate(0 ${ty})`, opacity: seg(t, 9.55, 9.85) * (1 - out) });
  swapSet(sw, s3h1, s3h2, s3c1, s3c2);
  set(s3cap, { transform: `translate(0 ${ty + 44})`, opacity: seg(t, 9.75, 10.05) * (1 - out) });
}

// ---------- 4. 끝 카드 ----------
const S4 = $('g', {}, root);
const logo = $('g', {}, S4);
$('rect', { x: 16, y: 16, width: 96, height: 96, rx: 24, fill: BLUE }, logo);
const arm = [['#1b2140', 27], [ORANGE, 18], ['#fff', 3.5]].map(([c, w]) => $('path', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, logo));
const lj0 = $('circle', { cx: 40, cy: 89, r: 6.5, fill: '#fff', stroke: '#1b2140', 'stroke-width': 3 }, logo), lj1 = $('circle', { r: 5.5, fill: '#fff' }, logo), lj2 = $('circle', { cx: 91, cy: 43, r: 5.5, fill: '#fff' }, logo);
const s4t = txt(S4, 640, 468, 56, INK, 'middle', '', 700);
const s4a = $('tspan', {}, s4t); s4a.textContent = '엔트리루트 애니메이터 ';
const s4b = $('tspan', { fill: BONE }, s4t); s4b.textContent = '1.2';
const s4s = txt(S4, 640, 522, 27, SUB, 'middle', '크롬 웹스토어 · 무료', 700);
const s4f = txt(S4, 640, 650, 19, FAINT, 'middle', '엔트리용 비공식 확장 · 엔트리봇 © NAVER Connect Foundation', 600);
function scene4(t) {
  show(S4, t > 12.7); if (!(t > 12.7)) return;
  const pop = back(seg(t, 12.75, 13.2)), fade = 1 - seg(t, 14.72, 15);
  set(logo, { transform: `translate(640 262) scale(${1.45 * pop}) translate(-64 -64)`, opacity: fade });
  const b = eio(seg(t, 13.15, 13.55)) - 0.35 * eio(seg(t, 13.55, 13.8)) + 0.35 * eio(seg(t, 13.8, 14.05));
  const mx = lerp(65.5, 55, b), my = lerp(66, 55, b);
  arm.forEach(p => set(p, { d: `M40,89 L${mx},${my} L91,43` })); set(lj1, { cx: mx, cy: my });
  const k1 = eo(seg(t, 13.0, 13.4)), k2 = eo(seg(t, 13.2, 13.6)), k3 = seg(t, 13.5, 13.8);
  set(s4t, { opacity: k1 * fade, transform: `translate(0 ${22 * (1 - k1)})` });
  set(s4s, { opacity: k2 * fade, transform: `translate(0 ${18 * (1 - k2)})` });
  set(s4f, { opacity: k3 * fade });
}

window.renderAt = t => { scene0(t); scene1(t); scene2(t); scene3(t); scene4(t); };
window.renderAt(0);
</script>
